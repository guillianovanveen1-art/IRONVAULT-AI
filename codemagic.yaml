workflows:
  ios-workflow:
    name: IRONVAULT AI IPA Build

    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:

      - name: Install dependencies
        script: |
          npm install

      - name: Capacitor sync
        script: |
          chmod -R 755 node_modules
          npx cap sync ios

      - name: Build Archive
        script: |
          cd ios/App

          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Extract App
        script: |
          mkdir -p $CM_BUILD_DIR/Payload

          cp -R $CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app \
          $CM_BUILD_DIR/Payload/

          cd $CM_BUILD_DIR

          zip -r IRONVAULT-AI.zip Payload

    artifacts:
      - $CM_BUILD_DIR/IRONVAULT-AI.zip
      - $CM_BUILD_DIR/*.xcarchive