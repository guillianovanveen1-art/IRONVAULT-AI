workflows:
  ios-workflow:
    name: IRONVAULT AI iOS Build

    instance_type: mac_mini

    environment:
      xcode: latest

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build iOS app
        script: |
          cd ios
          xcodebuild \
          -workspace App/App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App.xcarchive \
          archive

    artifacts:
      - ios/build/*.xcarchive
      - ios/build/**/*.ipa