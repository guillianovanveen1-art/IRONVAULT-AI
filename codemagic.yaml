workflows:
  ios-workflow:
    name: IRONVAULT AI IPA Build

    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Update Capacitor
        script: |
          chmod -R 755 node_modules
          npm rebuild
          npx cap sync ios

      - name: Check iOS project
        script: |
          ls -la ios
          ls -la ios/App

      - name: Build IPA
        script: |
          cd ios/App

          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR

    artifacts:
      - $CM_BUILD_DIR/*.ipa
      - $CM_BUILD_DIR/*.xcarchive