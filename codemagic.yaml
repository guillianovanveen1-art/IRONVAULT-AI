workflows:
  ios-workflow:
    name: IRONVAULT AI IPA Build

    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Update Capacitor
        script: |
          chmod -R 755 node_modules
          npm rebuild
          npx cap sync ios

      - name: Build IPA
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive

    artifacts:
      - $CM_BUILD_DIR/*.xcarchive
      - $CM_BUILD_DIR/**/*.ipa